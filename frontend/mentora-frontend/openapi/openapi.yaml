openapi: 3.0.3
info:
  title: Mentora API
  description: >
    Плейсхолдер OpenAPI-спецификации. Реальный контракт экспортируется
    бэкендом (C# ASP.NET Core) через Swagger и копируется сюда целиком
    (см. openapi/README.md). Ниже — заготовка со скелетом эндпоинтов,
    достаточная для первого прогона `yarn api:generate`.
  version: 0.0.1
servers:
  - url: /api
tags:
  - name: auth
  - name: courses
  - name: lessons
  - name: enrollments
  - name: payments
  - name: analytics
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Обновление access-токена
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Инвалидация refresh-токена на сервере
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: No Content
  /courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: Каталог курсов (пагинация/фильтры)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: search
          in: query
          description: Полнотекстовый поиск по названию/описанию курса
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/CourseCategory'
        - name: priceMin
          in: query
          schema:
            type: number
        - name: priceMax
          in: query
          schema:
            type: number
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/CourseSort'
        - name: instructorId
          in: query
          description: Только курсы конкретного инструктора — используется страницей управления "Мои курсы" (роль instructor/admin) и публичным профилем инструктора.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
    post:
      tags: [courses]
      operationId: createCourse
      summary: Создать курс (черновик, метаданные)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseMetaRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
  /courses/{courseId}:
    get:
      tags: [courses]
      operationId: getCourse
      summary: Детали курса
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
    put:
      tags: [courses]
      operationId: updateCourse
      summary: Обновить метаданные курса (только владелец-инструктор/админ)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseMetaRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
  /courses/{courseId}/reviews:
    get:
      tags: [courses]
      operationId: listCourseReviews
      summary: Отзывы и оценки курса
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
    post:
      tags: [courses]
      operationId: createCourseReview
      summary: Оставить отзыв (только записанный на курс пользователь, один отзыв на курс)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '403':
          description: Пользователь не записан на курс
  /courses/{courseId}/reviews/{reviewId}:
    put:
      tags: [courses]
      operationId: updateCourseReview
      summary: Отредактировать свой отзыв
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
  /courses/{courseId}/chapters:
    get:
      tags: [courses]
      operationId: listChapters
      summary: Структура курса — главы с вложенными уроками (в порядке order)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
    put:
      tags: [courses]
      operationId: saveChapters
      summary: >
        Сохранить всё дерево глав/уроков курса целиком (создание,
        удаление, переименование и порядок — включая результат
        drag & drop). Клиент присылает полный актуальный массив; новые
        главы/уроки приходят с id, сгенерированным на клиенте
        (`crypto.randomUUID()`), сервер сохраняет их как есть (upsert по
        id внутри courseId).
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Chapter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
  /lessons/{lessonId}/content:
    put:
      tags: [lessons]
      operationId: saveLessonContent
      summary: >
        Сохранить rich-text содержимое урока. contentHtml — HTML-строка,
        сериализованная из TipTap (editor.getHTML()), не JSON-документ
        ProseMirror — см. openapi/README.md/деталь в schedule/03.
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonContentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
  /lessons/{lessonId}/video:
    post:
      tags: [lessons]
      operationId: uploadLessonVideo
      summary: Загрузить видео урока (multipart, с прогрессом на клиенте)
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadResponse'
  /enrollments:
    get:
      tags: [enrollments]
      operationId: listEnrollments
      summary: Курсы, на которые записан текущий пользователь (с прогрессом)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentWithCourse'
    post:
      tags: [enrollments]
      operationId: createEnrollment
      summary: Записать пользователя на курс (бесплатный или уже оплаченный)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
  /enrollments/{courseId}:
    get:
      tags: [enrollments]
      operationId: getEnrollmentStatus
      summary: Проверить, записан ли текущий пользователь на конкретный курс
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK — пользователь записан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '404':
          description: Пользователь не записан на этот курс
  /enrollments/{courseId}/progress:
    get:
      tags: [enrollments]
      operationId: getCourseProgress
      summary: Прогресс прохождения курса — по уроку и агрегированный процент
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgress'
  /enrollments/{courseId}/lessons/{lessonId}/progress:
    put:
      tags: [enrollments]
      operationId: updateLessonProgress
      summary: >
        Сохранить позицию воспроизведения и статус прохождения урока.
        Возвращает пересчитанный агрегат по курсу целиком, чтобы клиент мог
        напрямую заменить кэш GET .../progress без ручного мержа.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonProgressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgress'
  /payments/checkout:
    post:
      tags: [payments]
      operationId: createCheckoutSession
      summary: Создать сессию оплаты (Stripe Checkout)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
  /payments/sessions/{sessionId}:
    get:
      tags: [payments]
      operationId: getCheckoutSessionStatus
      summary: Статус сессии оплаты (поллинг после возврата со Stripe)
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionStatus'
  /analytics/instructor:
    get:
      tags: [analytics]
      operationId: getInstructorAnalytics
      summary: Аналитика инструктора (доходы/зачисления)
      parameters:
        - name: period
          in: query
          description: Предустановленный период агрегации. По умолчанию 30d.
          schema:
            $ref: '#/components/schemas/AnalyticsPeriod'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorAnalytics'
  /analytics/admin:
    get:
      tags: [analytics]
      operationId: getAdminAnalytics
      summary: Агрегированная аналитика платформы (админ)
      parameters:
        - name: period
          in: query
          description: Предустановленный период агрегации. По умолчанию 30d.
          schema:
            $ref: '#/components/schemas/AnalyticsPeriod'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalytics'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        fullName:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, fullName, role]
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
    UserRole:
      type: string
      enum: [student, instructor, admin]
    Course:
      type: object
      required:
        [
          id,
          title,
          description,
          price,
          instructorId,
          instructorName,
          category,
          thumbnailUrl,
          createdAt,
        ]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        instructorId:
          type: string
        instructorName:
          type: string
        category:
          $ref: '#/components/schemas/CourseCategory'
        thumbnailUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        averageRating:
          type: number
          nullable: true
          description: Средний рейтинг 1-5, null если отзывов ещё нет (не 0 — ноль читался бы как "плохой курс").
        reviewsCount:
          type: integer
          description: Число отзывов. 0, если отзывов нет — в этом случае averageRating тоже null.
    CourseCategory:
      type: string
      enum: [development, design, business, marketing, it, other]
    CourseSort:
      type: string
      enum: [newest, price_asc, price_desc, popular, rating]
    Review:
      type: object
      required: [id, courseId, userId, userName, rating, createdAt]
      properties:
        id:
          type: string
        courseId:
          type: string
        userId:
          type: string
        userName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
    CourseMetaRequest:
      type: object
      required: [title, description, price, category]
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          $ref: '#/components/schemas/CourseCategory'
    Chapter:
      type: object
      required: [id, courseId, title, order, lessons]
      properties:
        id:
          type: string
        courseId:
          type: string
        title:
          type: string
        order:
          type: integer
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
    Lesson:
      type: object
      required: [id, chapterId, title, order, contentHtml, videoUrl]
      properties:
        id:
          type: string
        chapterId:
          type: string
        title:
          type: string
        order:
          type: integer
        contentHtml:
          type: string
          description: HTML из TipTap (editor.getHTML()), пустая строка если контента ещё нет.
        videoUrl:
          type: string
          nullable: true
          description: null, пока видео не загружено.
    LessonContentRequest:
      type: object
      required: [contentHtml]
      properties:
        contentHtml:
          type: string
    VideoUploadResponse:
      type: object
      required: [videoUrl]
      properties:
        videoUrl:
          type: string
    CoursePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    EnrollmentRequest:
      type: object
      required: [courseId]
      properties:
        courseId:
          type: string
    Enrollment:
      type: object
      required: [id, courseId, userId, progress]
      properties:
        id:
          type: string
        courseId:
          type: string
        userId:
          type: string
        progress:
          type: number
    EnrollmentWithCourse:
      type: object
      required: [id, courseId, userId, progress, course]
      properties:
        id:
          type: string
        courseId:
          type: string
        userId:
          type: string
        progress:
          type: number
        course:
          $ref: '#/components/schemas/Course'
    LessonProgress:
      type: object
      required: [lessonId, completed, positionSeconds]
      properties:
        lessonId:
          type: string
        completed:
          type: boolean
        positionSeconds:
          type: number
    CourseProgress:
      type: object
      required: [courseId, progressPercent, lessons]
      properties:
        courseId:
          type: string
        progressPercent:
          type: number
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonProgress'
    UpdateLessonProgressRequest:
      type: object
      required: [positionSeconds, completed]
      properties:
        positionSeconds:
          type: number
        completed:
          type: boolean
    CheckoutRequest:
      type: object
      required: [courseId]
      properties:
        courseId:
          type: string
    CheckoutSession:
      type: object
      required: [checkoutUrl, sessionId]
      properties:
        checkoutUrl:
          type: string
        sessionId:
          type: string
    CheckoutSessionStatusValue:
      type: string
      description: >
        pending — оплата ещё не завершена (ждём вебхук/подтверждение от
        Stripe); completed/failed/expired — финальные статусы, поллинг
        останавливается.
      enum: [pending, completed, failed, expired]
    CheckoutSessionStatus:
      type: object
      required: [sessionId, status, courseId]
      properties:
        sessionId:
          type: string
        status:
          $ref: '#/components/schemas/CheckoutSessionStatusValue'
        courseId:
          type: string
    AnalyticsPeriod:
      type: string
      description: Предустановленный период агрегации аналитики (без произвольного диапазона дат).
      enum: [7d, 30d, 90d]
    RevenuePoint:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
    CourseEnrollmentPoint:
      type: object
      required: [courseId, courseTitle, enrollments]
      properties:
        courseId:
          type: string
        courseTitle:
          type: string
        enrollments:
          type: integer
    InstructorAnalytics:
      type: object
      required:
        [
          totalRevenue,
          totalEnrollments,
          revenueChangePercent,
          enrollmentsChangePercent,
          revenueByPeriod,
          enrollmentsByCourse,
        ]
      properties:
        totalRevenue:
          type: number
        totalEnrollments:
          type: integer
        revenueChangePercent:
          type: number
          description: Изменение дохода в % относительно предыдущего периода той же длины.
        enrollmentsChangePercent:
          type: number
          description: Изменение числа зачислений в % относительно предыдущего периода той же длины.
        revenueByPeriod:
          type: array
          items:
            $ref: '#/components/schemas/RevenuePoint'
        enrollmentsByCourse:
          type: array
          items:
            $ref: '#/components/schemas/CourseEnrollmentPoint'
    AdminAnalytics:
      type: object
      required:
        [
          totalRevenue,
          totalUsers,
          totalCourses,
          totalEnrollments,
          revenueChangePercent,
          userGrowthPercent,
          revenueByPeriod,
          enrollmentsByCourse,
        ]
      properties:
        totalRevenue:
          type: number
          description: Суммарный доход платформы за период.
        totalUsers:
          type: integer
          description: Общее число зарегистрированных пользователей.
        totalCourses:
          type: integer
          description: Общее число опубликованных курсов на платформе.
        totalEnrollments:
          type: integer
          description: Общее число зачислений за период.
        revenueChangePercent:
          type: number
          description: Изменение дохода в % относительно предыдущего периода той же длины.
        userGrowthPercent:
          type: number
