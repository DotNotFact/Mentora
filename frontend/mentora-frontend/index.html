<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#262624" />
    <meta
      name="description"
      content="Mentora — платформа онлайн-курсов. Учитесь у практикующих инструкторов, отслеживайте прогресс, получайте сертификаты."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mentora" />
    <meta property="og:image" content="/og-image.png" />
    <title>Mentora</title>
    <script>
      // Применяет сохранённую тему ДО первого рендера — предотвращает
      // вспышку дефолтной темы для пользователей, выбравших другую (см.
      // schedule/11, шаг 5). Дефолт (:root без [data-theme] в globals.css)
      // уже dark-purple, так что при пустом/битом localStorage флеша нет
      // в принципе — этот скрипт нужен только для НЕ-дефолтных выборов.
      (function () {
        try {
          var raw = localStorage.getItem('mentora-theme');
          if (!raw) return;
          var theme = JSON.parse(raw).state.theme;
          if (typeof theme === 'string') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {
          // Битые данные в localStorage — остаёмся на дефолтной теме.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
